name: Generate MCEC Tournament Statistics

on:
  push:
    paths:
      - 'seasons/**' # Triggers whenever you add or edit PGNs inside seasons/

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install python-chess

      - name: Run Stats Generator Script
        run: python generate_stats.py

      - name: Commit and Push Updated README
        run: |
          git config --global user.name 'MCEC-Bot'
          git config --global user.email 'bot@mcec.local'
          git add README.md
          git diff --quiet || git commit -m "Auto-update MCEC standings and crosstables [skip ci]"
          git push
