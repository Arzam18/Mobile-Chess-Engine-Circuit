name: Full Engine View

on:
  push:
    branches:
      - main  # Adjust to your default branch if different (e.g., master)
    paths:
      - 'seasons/**'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

concurrency:
  group: mcec-stats-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-full-engine-view:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chess

      - name: Run Full Engine Tracking Script
        run: |
          python generate_stats_3.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Mobile-Chess-Engine-Circuit/more_results/full_engine_results_all_over/
          git diff --staged --quiet || git commit -m "chore: update full engine tracking stats [skip ci]"
          git pull --rebase origin main
          git push
