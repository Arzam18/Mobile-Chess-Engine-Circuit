name: Generate All MCEC Statistics

on:
  push:
    paths:
      - 'seasons/**' # Triggers whenever any PGN inside seasons changes
  workflow_dispatch: # Allows manual triggering from the Actions tab

concurrency:
  group: mcec-complete-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-all-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chess python-chess

      - name: 1. Run Main Tournament Stats
        run: python generate_stats.py

      - name: 2. Run Independent Evaluation
        run: python generate_stats_2.py

      - name: 3. Run Full Engine Tracking
        run: python generate_stats_3.py

      - name: 4. Run All Version Lists
        run: python generate_stats_4.py

      - name: Commit and Push All Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update all MCEC tournament stats and views [skip ci]"
          git pull --rebase origin main
          git push
