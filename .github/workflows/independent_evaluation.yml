name: Independent Evaluation

on:
  push:
    branches:
      - main  # Adjust to your default branch if different (e.g., master)
    paths:
      - 'seasons/season_3/**/*.pgn'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

concurrency:
  group: mcec-stats-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-independent-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chess

      - name: Run Independent Statistics Script
        run: |
          python generate_stats_2.py

      - name: Commit and Push Generated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Mobile-Chess-Engine-Circuit/more_results/main/season_3/
          git diff --staged --quiet || git commit -m "chore: run independent evaluation stats update [skip ci]"
          git pull --rebase origin main
          git push
