name: Generate MCEC Tournament Statistics

on:
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub Actions
  push:
    paths:
      - 'seasons/**' # Triggers automatically whenever PGNs inside seasons/ change

concurrency:
  group: update-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install python-chess

      - name: Run Stats Generator Script
        run: python generate_stats.py

      - name: Commit and Push Updated README
        run: |
          git config --global user.name 'MCEC-Bot'
          git config --global user.email 'bot@mcec.local'
          git add README.md
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update MCEC standings and crosstables [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected in README.md."
          fi
